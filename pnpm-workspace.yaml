  "undici@<6.28.1": "^6.28.1"
  "undici@>=7 <7.29.1": "^7.29.1"
  "js-yaml@<4.3.2": "^4.3.2"
  "fast-uri@<3.1.8": "^3.1.8"
  "http-cache-semantics@<4.3.0": "^4.3.0"
  "source-map-js@<1.2.2": "^1.2.2"
  "handlebars@<4.7.10": "^4.7.10"
